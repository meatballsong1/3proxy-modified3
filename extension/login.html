<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>proxy hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg: #0f0f23;
    --card: #1a1a2e;
    --text: #e4e4e7;
    --text-muted: #a1a1aa;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --border: #27272a;
    --danger: #ef4444;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .login-container {
    background: var(--card);
    border-radius: 16px;
    padding: 32px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
  }
  
  .logo-section {
    text-align: center;
    margin-bottom: 24px;
  }
  
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  
  .app-name {
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  
  .subtitle {
    color: var(--text-muted);
    font-size: 13px;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  label {
    display: block;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  
  input {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    transition: border-color 0.2s;
  }
  
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  
  input::placeholder {
    color: var(--text-muted);
  }
  
  .hint {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 6px;
  }
  
  button {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  
  button:hover {
    background: var(--accent-hover);
  }
  
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  
  .error {
    background: var(--danger);
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  
  .error.show {
    display: block;
    animation: shake 0.3s;
  }
  
  .welcome {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  
  .welcome.show {
    display: flex;
    animation: fadeIn 0.3s;
  }
  
  .welcome-content {
    text-align: center;
    color: white;
  }
  
  .welcome-content h2 {
    font-size: 28px;
    margin-bottom: 8px;
  }
  
  .welcome-content p {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.7);
  }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <div class="logo">🔒</div>
      <div class="app-name">proxy hub</div>
      <div class="subtitle">enter your credentials</div>
    </div>
    
    <div class="error" id="error"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="accessKey">access token</label>
        <input 
          type="text" 
          id="accessKey" 
          placeholder="enter your access token"
          autocomplete="off"
          required
        >
        <div class="hint">enter the access token you were given</div>
      </div>
      
      <button type="submit" id="loginBtn">login</button>
    </form>
  </div>
  
  <div class="welcome" id="welcome">
    <div class="welcome-content">
      <h2>welcome!</h2>
      <p>welcome to proxy hub</p>
    </div>
  </div>
  
  <script src="login.js"></script>
</body>
</html>
