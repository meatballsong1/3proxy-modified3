<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ProxyHub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #080b12;
  --s1:      #0d1120;
  --s2:      #111827;
  --border:  rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.10);
  --text:    #e8eaf0;
  --muted:   #4b5368;
  --dim:     #1e2535;
  --accent:  #4f8ef7;
  --accent2: #7b61ff;
  --green:   #22c55e;
  --red:     #ef4444;
  --yellow:  #f59e0b;
  --mono:    'JetBrains Mono', monospace;
  --sans:    'Space Grotesk', sans-serif;
}

body {
  width: 320px;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 100; pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 120px;
}

.glow { position: fixed; pointer-events: none; border-radius: 50%; filter: blur(70px); z-index: 0; transition: all 1.4s ease; }
.glow-a { width: 260px; height: 260px; top: -80px; left: -60px; background: radial-gradient(circle, rgba(79,142,247,0.10) 0%, transparent 70%); }
.glow-b { width: 200px; height: 200px; bottom: -50px; right: -40px; background: radial-gradient(circle, rgba(123,97,255,0.09) 0%, transparent 70%); }
.glow-a.connected { background: radial-gradient(circle, rgba(34,197,94,0.13) 0%, transparent 70%); }
.glow-b.connected { background: radial-gradient(circle, rgba(34,197,94,0.08) 0%, transparent 70%); }

.wrap { position: relative; z-index: 1; padding: 14px 14px 12px; }

/* Header */
.hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.logo { display: flex; align-items: center; gap: 7px; }
.logo-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 18px rgba(79,142,247,0.3);
  transition: background 0.7s, box-shadow 0.7s;
}
.logo-mark.connected { background: linear-gradient(135deg, #16a34a, var(--green)); box-shadow: 0 0 22px rgba(34,197,94,0.35); }
.logo-mark svg { width: 13px; height: 13px; color: #fff; }
.logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.4px; }
.logo-text em { font-style: normal; color: var(--accent); transition: color 0.7s; }
.logo-text em.connected { color: var(--green); }

.hub-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 20px;
  background: var(--s1); border: 1px solid var(--border);
  font-size: 10px; font-weight: 600; color: var(--muted);
  cursor: pointer; transition: all 0.15s;
}
.hub-pill:hover { border-color: var(--border2); color: var(--text); }
.hub-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
.hub-dot.on  { background: var(--green); animation: pdot 2s infinite; }
.hub-dot.off { background: var(--red); }
@keyframes pdot {
  0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
  60%     { box-shadow: 0 0 0 5px rgba(34,197,94,0); }
}

/* Settings */
.settings-panel { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.25s; }
.settings-panel.open { max-height: 90px; opacity: 1; }
.settings-inner { background: var(--s1); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; display: flex; gap: 6px; }
.settings-inner input { flex: 1; background: var(--s2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; color: var(--text); font-family: var(--mono); font-size: 10.5px; outline: none; transition: border-color 0.15s; }
.settings-inner input:focus { border-color: var(--accent); }
.settings-inner button { padding: 6px 12px; border-radius: 7px; border: none; background: var(--accent); color: #fff; font-family: var(--sans); font-size: 11px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
.settings-inner button:hover { opacity: 0.85; }

/* Error */
.err { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 0.3s, opacity 0.25s; }
.err.show { max-height: 55px; opacity: 1; }
.err-inner { background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.18); border-radius: 9px; padding: 7px 10px; margin-bottom: 11px; }
.err-title { font-size: 11px; font-weight: 700; color: var(--red); }
.err-body  { font-size: 10px; color: rgba(239,68,68,0.65); margin-top: 1px; }

/* Power area */
.power-area { display: flex; flex-direction: column; align-items: center; padding: 4px 0 10px; }

.orbit-wrap { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
.orbit-svg  { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.orbit-track { fill: none; stroke: var(--dim); stroke-width: 1.5; }
.orbit-line  {
  fill: none; stroke: var(--accent); stroke-width: 1.5;
  stroke-linecap: round; stroke-dasharray: 345; stroke-dashoffset: 345;
  transition: stroke-dashoffset 1.4s cubic-bezier(0.4,0,0.2,1), stroke 0.7s;
}
.orbit-line.filled { stroke-dashoffset: 0; stroke: var(--green); }
.orbit-line.spinning { animation: orbit-run 1.1s ease-in-out infinite; }
@keyframes orbit-run {
  0%   { stroke-dashoffset: 345; stroke-dasharray: 50 295; }
  50%  { stroke-dashoffset: 80;  stroke-dasharray: 130 215; }
  100% { stroke-dashoffset: -295; stroke-dasharray: 50 295; }
}

.orbit-dashes { position: absolute; inset: 4px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.04); }
.orbit-dashes.spinning { animation: dash-rot 4s linear infinite; }
@keyframes dash-rot { to { transform: rotate(360deg); } }

.power-btn {
  width: 82px; height: 82px; border-radius: 50%;
  background: var(--s1); border: 1.5px solid var(--border2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; gap: 4px; position: relative; z-index: 2;
  box-shadow: 0 2px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
  transition: transform 0.25s cubic-bezier(0.34,1.5,0.64,1), border-color 0.3s, box-shadow 0.3s, background 0.4s;
}
.power-btn:hover { transform: scale(1.06); border-color: rgba(79,142,247,0.5); box-shadow: 0 0 0 1px rgba(79,142,247,0.15), 0 4px 28px rgba(79,142,247,0.2); }
.power-btn:active { transform: scale(0.95); }
.power-btn.connected  { border-color: rgba(34,197,94,0.45); background: rgba(34,197,94,0.06); box-shadow: 0 0 0 1px rgba(34,197,94,0.15), 0 4px 28px rgba(34,197,94,0.18); }
.power-btn.connecting { border-color: rgba(245,158,11,0.35); animation: throb 0.9s ease-in-out infinite; }
@keyframes throb {
  0%,100% { box-shadow: 0 2px 20px rgba(0,0,0,0.6); }
  50%     { box-shadow: 0 0 0 10px rgba(245,158,11,0.06), 0 2px 20px rgba(0,0,0,0.6); }
}

.power-ico { width: 21px; height: 21px; color: var(--muted); transition: color 0.4s, filter 0.4s; }
.connected  .power-ico { color: var(--green); animation: glow-p 2s ease-in-out infinite; }
.connecting .power-ico { color: var(--yellow); animation: spin 0.8s linear infinite; }
@keyframes glow-p {
  0%,100% { filter: drop-shadow(0 0 4px rgba(34,197,94,0.5)); }
  50%     { filter: drop-shadow(0 0 12px rgba(34,197,94,0.95)); }
}
@keyframes spin { to { transform: rotate(360deg); } }

.power-lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); transition: color 0.4s; }
.connected  .power-lbl { color: var(--green); }
.connecting .power-lbl { color: var(--yellow); }

.status-line { margin-top: 9px; text-align: center; }
.status-main { font-size: 13px; font-weight: 700; letter-spacing: -0.2px; color: var(--muted); transition: color 0.4s; }
.status-main.on   { color: var(--green); }
.status-main.conn { color: var(--yellow); }
.status-sub { font-size: 10px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }

/* Connecting overlay */
.conn-overlay {
  position: absolute; inset: 0; z-index: 50;
  background: rgba(8,11,18,0.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 9px; opacity: 0; pointer-events: none;
  transition: opacity 0.3s; border-radius: 0;
}
.conn-overlay.show { opacity: 1; pointer-events: all; }
.conn-spinner { width: 32px; height: 32px; border: 2px solid var(--dim); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
.conn-msg { font-size: 12px; font-weight: 600; color: var(--text); font-family: var(--mono); }
.conn-dots::after { content: ''; animation: dots 1.5s steps(4) infinite; }
@keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
.conn-sub { font-size: 10px; color: var(--muted); }

/* Divider */
.divider { height: 1px; background: var(--border); margin: 0 0 10px; }

/* List */
.list-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
.list-hdr-l { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); }
.list-actions { display: flex; gap: 4px; align-items: center; }

.auto-btn { background: rgba(79,142,247,0.08); border: 1px solid rgba(79,142,247,0.15); color: var(--accent); font-family: var(--sans); font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
.auto-btn:hover { background: rgba(79,142,247,0.16); }
.refresh-btn { background: none; border: none; color: var(--muted); font-size: 13px; padding: 2px 6px; border-radius: 5px; cursor: pointer; transition: color 0.15s; }
.refresh-btn:hover { color: var(--text); }
.refresh-btn.spinning { animation: spin 0.7s linear infinite; }

.server-list { display: flex; flex-direction: column; gap: 4px; max-height: 170px; overflow-y: auto; }
.server-list::-webkit-scrollbar { width: 2px; }
.server-list::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

.empty-msg { text-align: center; padding: 18px; font-size: 11px; color: var(--muted); background: var(--s1); border-radius: 9px; border: 1px dashed var(--border); }

.srv-card {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 9px;
  background: var(--s1); border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, transform 0.2s;
}
.srv-card + .srv-card { animation: card-in 0.3s ease both; }
@keyframes card-in { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
.srv-card:hover  { border-color: var(--border2); background: var(--s2); transform: translateX(2px); }
.srv-card.sel    { border-color: rgba(79,142,247,0.35); background: rgba(79,142,247,0.04); }
.srv-card.active { border-color: rgba(34,197,94,0.35); background: rgba(34,197,94,0.05); }

.srv-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--dim); transition: background 0.3s, box-shadow 0.3s; }
.srv-card.active .srv-dot { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,0.6); animation: pdot 2s infinite; }
.srv-card.sel    .srv-dot { background: var(--accent); }

.srv-info { flex: 1; min-width: 0; }
.srv-name   { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srv-region { font-size: 9.5px; color: var(--muted); margin-top: 1px; font-family: var(--mono); }

.ping-wrap { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.ping-bars { display: flex; align-items: flex-end; gap: 2px; }
.ping-bar  { width: 3px; border-radius: 2px; background: var(--dim); transition: background 0.3s; }
.ping-bar:nth-child(1){height:4px} .ping-bar:nth-child(2){height:7px} .ping-bar:nth-child(3){height:10px} .ping-bar:nth-child(4){height:13px}
.pb-g{background:var(--green)} .pb-y{background:var(--yellow)} .pb-r{background:var(--red)}

.ping-ms { font-size: 9.5px; font-weight: 700; font-family: var(--mono); min-width: 28px; text-align: right; color: var(--muted); transition: color 0.3s; }
.pm-g{color:var(--green)} .pm-y{color:var(--yellow)} .pm-r{color:var(--red)}

.srv-btn { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text); cursor: pointer; flex-shrink: 0; transition: all 0.15s; }
.srv-btn:hover { border-color: var(--accent); color: var(--accent); }
.srv-card.active .srv-btn { border-color: rgba(34,197,94,0.3); color: var(--green); }

/* Footer */
.footer { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; margin-top: 4px; border-top: 1px solid var(--border); font-size: 10px; color: var(--muted); }
.footer-btn { background: none; border: none; cursor: pointer; font-family: var(--sans); font-size: 10px; color: var(--muted); padding: 0; transition: color 0.15s; }
.footer-btn:hover { color: var(--text); }

/* Disabled / offline node styles */
.srv-card.disabled {
  opacity: 0.55; cursor: default;
  border-color: rgba(239,68,68,0.12) !important;
  background: rgba(239,68,68,0.03) !important;
}
.srv-card.disabled:hover { transform: none; }
.dot-off { background: var(--red) !important; box-shadow: none !important; animation: none !important; }
.name-off { color: var(--muted); }
.offline-tag {
  display: inline-block; font-size: 8px; font-weight: 700;
  letter-spacing: 0.6px; padding: 1px 5px; border-radius: 4px;
  background: rgba(239,68,68,0.15); color: var(--red);
  vertical-align: middle; margin-left: 5px; font-family: var(--mono);
}
.srv-reason {
  font-size: 9.5px; color: rgba(239,68,68,0.6);
  margin-top: 2px; font-family: var(--mono);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn-off {
  opacity: 0.4; cursor: not-allowed;
  border-color: rgba(239,68,68,0.2) !important;
  color: var(--red) !important;
}
</style>
</head>
<body>

<div class="glow glow-a" id="glowA"></div>
<div class="glow glow-b" id="glowB"></div>

<div class="wrap" style="position:relative">

  <!-- Connecting overlay -->
  <div class="conn-overlay" id="connOverlay">
    <div class="conn-spinner"></div>
    <div class="conn-msg">Establishing tunnel<span class="conn-dots"></span></div>
    <div class="conn-sub" id="connSub">Routing through node</div>
  </div>

  <!-- Header -->
  <div class="hdr">
    <div class="logo">
      <div class="logo-mark" id="logoMark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          <path d="M4.93 4.93a10 10 0 0 0 0 14.14"/>
        </svg>
      </div>
      <div class="logo-text">Proxy<em id="logoEm">Hub</em></div>
    </div>
    <div class="hub-pill" id="hubPill">
      <div class="hub-dot" id="hubDot"></div>
      <span id="hubTxt">Connecting…</span>
    </div>
  </div>

  <!-- Settings -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-inner">
      <input id="hubUrlIn" type="text" placeholder="http://vpn2.oofbomb.xyz">
      <button id="saveHubBtn">Save</button>
    </div>
  </div>

  <!-- Error -->
  <div class="err" id="errBanner">
    <div class="err-inner">
      <div class="err-title" id="errTitle"></div>
      <div class="err-body"  id="errBody"></div>
    </div>
  </div>

  <!-- Power -->
  <div class="power-area">
    <div class="orbit-wrap" id="orbitWrap">
      <div class="orbit-dashes" id="orbitDashes"></div>
      <svg class="orbit-svg" viewBox="0 0 120 120">
        <circle class="orbit-track" cx="60" cy="60" r="55"/>
        <circle class="orbit-line" id="orbitLine" cx="60" cy="60" r="55"/>
      </svg>
      <button class="power-btn" id="powerBtn">
        <svg class="power-ico" id="powerIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64A9 9 0 1 1 5.64 19.36"/>
          <line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
        <span class="power-lbl" id="powerLbl">Connect</span>
      </button>
    </div>
    <div class="status-line">
      <div class="status-main" id="statusMain">Not Connected</div>
      <div class="status-sub"  id="statusSub">Select a server</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Servers -->
  <div class="list-hdr">
    <span class="list-hdr-l">Servers</span>
    <div class="list-actions">
      <button class="auto-btn"    id="autoBtn">⚡ Auto</button>
      <button class="refresh-btn" id="refreshBtn">↺</button>
    </div>
  </div>
  <div class="server-list" id="serverList">
    <div class="empty-msg">Loading servers…</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="footer-btn" id="settingsToggleBtn">⚙ Settings</button>
    <span id="footerInfo"></span>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
