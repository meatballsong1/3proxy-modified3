<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProxyHub VPN</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0b14;
  --surface: #16112a;
  --surface2: #1e1838;
  --border: rgba(167,139,250,0.12);
  --accent: #a78bfa;
  --accent2: #e879f9;
  --text: #ede9ff;
  --text2: #8c87ab;
  --text3: #514d6a;
  --green: #34d399;
  --green2: #6ee7b7;
  --red: #f87171;
  --yellow: #fbbf24;
}

body {
  width: 340px; min-height: 460px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'DM Sans', BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.mesh {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 200px 200px at 10% 20%, rgba(124,92,232,0.14) 0%, transparent 60%),
    radial-gradient(ellipse 180px 180px at 90% 80%, rgba(232,121,249,0.09) 0%, transparent 55%);
  transition: background 1s ease;
}
.mesh.connected {
  background:
    radial-gradient(ellipse 250px 250px at 20% 30%, rgba(52,211,153,0.15) 0%, transparent 55%),
    radial-gradient(ellipse 200px 200px at 80% 70%, rgba(110,231,183,0.10) 0%, transparent 50%);
}

.wrap { position: relative; z-index: 1; padding: 16px 15px 14px; }

.hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.logo { display: flex; align-items: center; gap: 8px; }
.logo-icon {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, #7c5ce8, #e879f9);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(124,92,232,0.4);
  transition: background 0.5s;
}
.logo-icon.connected { background: linear-gradient(135deg, #10b981, #34d399); box-shadow: 0 3px 14px rgba(52,211,153,0.5); }
.logo-icon svg { width: 13px; height: 13px; color: white; }
.logo-name { font-size: 14px; font-weight: 800; letter-spacing: -0.3px; }
.logo-name span { color: var(--accent); transition: color 0.5s; }
.logo-name span.connected { color: var(--green); }

.hub-pill {
  display: flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 600; color: var(--text3);
  background: var(--surface); border: 1px solid var(--border);
  padding: 3px 9px; border-radius: 20px; cursor: pointer;
  transition: all 0.15s;
}
.hub-pill:hover { border-color: rgba(167,139,250,0.3); color: var(--text2); }
.hub-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); transition: background 0.3s; }
.hub-dot.online  { background: var(--green); animation: glowDot 2s infinite; }
.hub-dot.offline { background: var(--red); }
@keyframes glowDot {
  0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,0.5)}
  50%{box-shadow:0 0 0 4px rgba(52,211,153,0)}
}

.settings-panel {
  display: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px; margin-bottom: 12px;
}
.settings-panel.show { display: block; }
.settings-panel label { font-size: 10.5px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 5px; }
.settings-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; padding: 7px 10px; color: var(--text);
  font-size: 11.5px; font-family: monospace; outline: none; margin-bottom: 7px;
  transition: border-color 0.15s;
}
.settings-input:focus { border-color: var(--accent); }
.settings-save {
  width: 100%; padding: 7px; border-radius: 7px; border: none;
  background: linear-gradient(135deg, #7c5ce8, #e879f9);
  color: white; font-size: 12px; font-weight: 700; cursor: pointer;
  transition: opacity 0.15s;
}
.settings-save:hover { opacity: 0.85; }

.err-banner {
  display: none;
  background: linear-gradient(135deg, rgba(248,113,113,0.1), rgba(236,72,153,0.07));
  border: 1px solid rgba(248,113,113,0.2); border-radius: 10px;
  padding: 9px 11px; margin-bottom: 13px;
  animation: slideDown 0.3s cubic-bezier(0.34,1.3,0.64,1);
}
.err-banner.show { display: block; }
@keyframes slideDown { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }
.err-title { font-size: 12px; font-weight: 800; color: var(--red); margin-bottom: 2px; }
.err-body  { font-size: 11.5px; color: #f8a; line-height: 1.5; }

.connect-area {
  display: flex; align-items: center; justify-content: center;
  margin: 2px auto 16px; position: relative;
  width: 124px; height: 124px;
}

.ring-svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  transform: rotate(-90deg); pointer-events: none;
}
.ring-track { fill: none; stroke: var(--surface2); stroke-width: 3.5; }
.ring-fill {
  fill: none; stroke: url(#rg); stroke-width: 3.5;
  stroke-linecap: round;
  stroke-dasharray: 326;
  stroke-dashoffset: 326;
  transition: stroke-dashoffset 0.9s cubic-bezier(0.4,0,0.2,1);
}
.ring-fill.connected { stroke-dashoffset: 0; stroke: url(#rg-green); }
.ring-fill.connecting { animation: ringPulse 1s ease-in-out infinite; }
@keyframes ringPulse {
  0%  { stroke-dashoffset: 326; }
  50% { stroke-dashoffset: 82; }
  100%{ stroke-dashoffset: 326; }
}

.connect-btn {
  width: 92px; height: 92px; border-radius: 50%;
  background: var(--surface2); border: 2px solid var(--border);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; gap: 3px; position: relative; z-index: 1;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  transition: all 0.25s cubic-bezier(0.34,1.4,0.64,1);
}
.connect-btn:hover { transform: scale(1.06); border-color: var(--accent); box-shadow: 0 6px 28px rgba(124,92,232,0.35), inset 0 1px 0 rgba(255,255,255,0.06); }
.connect-btn:active { transform: scale(0.96); }
.connect-btn.connected {
  background: linear-gradient(135deg, rgba(52,211,153,0.2), rgba(110,231,183,0.12));
  border-color: var(--green); box-shadow: 0 0 0 1px rgba(52,211,153,0.3), 0 8px 32px rgba(52,211,153,0.35);
}
.connect-btn.connecting { border-color: var(--yellow); animation: btnPulse 0.8s ease-in-out infinite; }
@keyframes btnPulse {
  0%,100%{box-shadow:0 4px 20px rgba(0,0,0,0.4)}
  50%{box-shadow:0 0 0 8px rgba(251,191,36,0.1), 0 4px 20px rgba(0,0,0,0.4)}
}

.btn-ico {
  width: 22px; height: 22px; color: var(--text2);
  transition: color 0.4s, filter 0.4s;
}
.connect-btn.connected .btn-ico {
  color: var(--green);
  filter: drop-shadow(0 0 6px rgba(52,211,153,0.8));
  animation: powerGlow 2s ease-in-out infinite;
}
.connect-btn.connecting .btn-ico { color: var(--yellow); animation: spin 0.8s linear infinite; }
@keyframes powerGlow {
  0%,100% { filter: drop-shadow(0 0 4px rgba(52,211,153,0.6)); }
  50%      { filter: drop-shadow(0 0 10px rgba(52,211,153,1)); }
}
@keyframes spin { to { transform: rotate(360deg); } }

.btn-lbl {
  font-size: 10px; font-weight: 800; color: var(--text2);
  letter-spacing: 0.3px; text-transform: uppercase;
  transition: color 0.3s; line-height: 1;
  display: block; text-align: center; width: 100%;
}
.connect-btn.connected  .btn-lbl { color: var(--green); }
.connect-btn.connecting .btn-lbl { color: var(--yellow); }

.status-area { text-align: center; margin-bottom: 14px; min-height: 34px; }
.status-main { font-size: 14.5px; font-weight: 800; letter-spacing: -0.2px; transition: color 0.4s; }
.status-main.on   { color: var(--green); }
.status-main.off  { color: var(--text2); }
.status-main.conn { color: var(--yellow); }
.status-sub  { font-size: 11.5px; color: var(--text3); margin-top: 2px; }

.list-hdr {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--text3); margin-bottom: 7px;
}
.refresh-btn {
  cursor: pointer; color: var(--text3); font-size: 12px;
  background: none; border: none; padding: 2px 6px; border-radius: 5px;
  transition: all 0.15s;
}
.refresh-btn:hover { background: var(--surface); color: var(--accent); }
.refresh-btn.spinning { animation: spin 0.7s linear infinite; }

.server-list {
  display: flex; flex-direction: column; gap: 5px;
  max-height: 180px; overflow-y: auto; margin-bottom: 12px;
}
.server-list::-webkit-scrollbar { width: 3px; }
.server-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.server-card {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 11px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.18s cubic-bezier(0.34,1.3,0.64,1);
  user-select: none;
}
.server-card:hover { border-color: rgba(167,139,250,0.3); background: var(--surface2); transform: translateX(2px); }
.server-card.selected { border-color: var(--accent); background: rgba(167,139,250,0.08); }
.server-card.active-conn { border-color: var(--green); background: rgba(52,211,153,0.07); }

.srv-info { flex: 1; }
.srv-name   { font-size: 12.5px; font-weight: 700; }
.srv-region { font-size: 10.5px; color: var(--text3); margin-top: 1px; font-family: monospace; }

.ping-meter { display: flex; align-items: flex-end; gap: 2px; margin-left: auto; }
.ping-bar {
  width: 3px; border-radius: 2px;
  background: var(--surface2); transition: background 0.3s, height 0.3s;
}
.ping-bar:nth-child(1) { height: 5px; }
.ping-bar:nth-child(2) { height: 8px; }
.ping-bar:nth-child(3) { height: 11px; }
.ping-bar:nth-child(4) { height: 14px; }
.ping-bar.lit-green  { background: #34d399; }
.ping-bar.lit-yellow { background: #fbbf24; }
.ping-bar.lit-red    { background: #f87171; }

.ping-label {
  font-size: 9.5px; font-weight: 700; margin-left: 4px;
  min-width: 28px; text-align: right; font-family: monospace;
}
.ping-label.green  { color: #34d399; }
.ping-label.yellow { color: #fbbf24; }
.ping-label.red    { color: #f87171; }
.ping-label.grey   { color: var(--text3); }

.connect-srv-btn {
  font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 6px; border: none;
  background: var(--accent); color: white; cursor: pointer; margin-left: 6px;
  transition: all 0.15s; flex-shrink: 0; opacity: 0.9;
}
.connect-srv-btn:hover { opacity: 1; transform: scale(1.05); }
.connect-srv-btn.active { background: var(--green); }

.empty-msg { text-align: center; padding: 16px; font-size: 12px; color: var(--text3); background: var(--surface); border-radius: 9px; border: 1px dashed var(--border); }

.footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--text3); }
.footer-link { cursor: pointer; transition: color 0.15s; background: none; border: none; color: var(--text3); font-size: 10.5px; padding: 0; }
.footer-link:hover { color: var(--accent); }

.auto-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  background: rgba(167,139,250,0.1); color: var(--accent);
  border: 1px solid rgba(167,139,250,0.2); cursor: pointer; transition: all 0.15s;
}
.auto-chip:hover { background: rgba(167,139,250,0.18); }
</style>
</head>
<body>
<div class="mesh" id="mesh"></div>
<div class="wrap">

  <div class="hdr">
    <div class="logo">
      <div class="logo-icon" id="logoIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          <path d="M4.93 4.93a10 10 0 0 0 0 14.14"/>
        </svg>
      </div>
      <div class="logo-name">Proxy<span id="logoSpan">Hub</span></div>
    </div>
    <div class="hub-pill" id="hubPill">
      <div class="hub-dot" id="hubDot"></div>
      <span id="hubTxt">Connecting…</span>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <label for="hubUrlIn">Hub URL</label>
    <input class="settings-input" id="hubUrlIn" type="text" placeholder="http://vpn2.oofbomb.xyz">
    <button class="settings-save" id="saveHubBtn">Save &amp; Reconnect</button>
  </div>

  <div class="err-banner" id="errBanner">
    <div class="err-title" id="errTitle">Not Whitelisted</div>
    <div class="err-body" id="errBody">Your IP isn't on the access list.</div>
  </div>

  <div class="connect-area">
    <svg class="ring-svg" viewBox="0 0 124 124">
      <defs>
        <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c5ce8"/>
          <stop offset="100%" stop-color="#e879f9"/>
        </linearGradient>
        <linearGradient id="rg-green" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#10b981"/>
          <stop offset="100%" stop-color="#6ee7b7"/>
        </linearGradient>
      </defs>
      <circle class="ring-track" cx="62" cy="62" r="52"/>
      <circle class="ring-fill" id="ringFill" cx="62" cy="62" r="52"/>
    </svg>
    <button class="connect-btn" id="connectBtn">
      <svg class="btn-ico" id="btnIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64A9 9 0 1 1 5.64 19.36"/>
        <line x1="12" y1="2" x2="12" y2="12"/>
      </svg>
      <span class="btn-lbl" id="btnLbl">Connect</span>
    </button>
  </div>

  <div class="status-area">
    <div class="status-main off" id="statusMain">Not Connected</div>
    <div class="status-sub" id="statusSub">Select a server below</div>
  </div>

  <div class="list-hdr">
    <span>Available Servers</span>
    <div style="display:flex;gap:6px;align-items:center">
      <span class="auto-chip" id="autoChip">⚡ Auto</span>
      <button class="refresh-btn" id="refreshBtn" title="Refresh">↺</button>
    </div>
  </div>
  <div class="server-list" id="serverList">
    <div class="empty-msg">Loading servers…</div>
  </div>

  <div class="footer">
    <button class="footer-link" id="settingsToggleBtn">⚙ Settings</button>
    <span id="selectedLbl" style="font-size:10.5px;color:var(--text3)">No server selected</span>
    <span id="connectedLbl" style="font-size:10.5px;color:var(--text3)"></span>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
