<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>proxy hub</title>
<style>
  :root {
    --bg:            #f5f3ff;
    --bg-2:          #ede9fe;
    --card:          #ffffff;
    --text:          #1e1b4b;
    --text-muted:    #64748b;
    --border:        #e2e8f0;
    --border-soft:   #f1f5f9;
    --accent:        #6366f1;
    --accent-2:      #8b5cf6;
    --success:       #10b981;
    --success-soft:  #d1fae5;
    --danger:        #ef4444;
    --danger-soft:   #fee2e2;
    --warning:       #f59e0b;
    --warning-soft:  #fef3c7;
    --shadow:        0 2px 8px rgba(99,102,241,.08), 0 1px 3px rgba(0,0,0,.04);
    --shadow-lg:     0 10px 30px rgba(99,102,241,.15), 0 4px 10px rgba(0,0,0,.06);
    --radius:        12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:          #0f0f1e;
      --bg-2:        #1a1a2e;
      --card:        #1e1e2e;
      --text:        #e2e8f0;
      --text-muted:  #94a3b8;
      --border:      #2d2d44;
      --border-soft: #252540;
      --success-soft:#064e3b;
      --danger-soft: #7f1d1d;
      --warning-soft:#78350f;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 360px;
    min-height: 480px;
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    font-size: 13.5px;
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 14px; }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 2px 14px;
  }
  .logo {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    color: white;
    box-shadow: 0 4px 12px rgba(99,102,241,.35);
  }
  .header-text { flex: 1; min-width: 0; }
  .header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .header-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }
  .hub-status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .hub-status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    flex: none;
  }
  .hub-status.connected {
    color: var(--success);
  }
  .hub-status.connected .hub-status-dot {
    background: var(--success);
    box-shadow: 0 0 0 2px rgba(16,185,129,.2);
  }
  .hub-status.error {
    color: var(--danger);
  }
  .hub-status.error .hub-status-dot {
    background: var(--danger);
  }
  .icon-btn {
    width: 30px; height: 30px;
    border: none; background: transparent;
    color: var(--text-muted);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .icon-btn:hover { background: var(--border-soft); color: var(--text); }

  .status {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .status-row {
    display: flex; align-items: center; gap: 10px;
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--text-muted);
    flex: none;
    box-shadow: 0 0 0 3px var(--border-soft);
    transition: all .25s;
  }
  .status-dot.on {
    background: var(--success);
    box-shadow: 0 0 0 3px var(--success-soft);
    animation: pulse 2s ease-in-out infinite;
  }
  .status-dot.pac {
    background: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(139,92,246,.2);
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px var(--success-soft); }
    50%      { box-shadow: 0 0 0 6px rgba(16,185,129,.15); }
  }
  .status-main {
    flex: 1; min-width: 0;
  }
  .status-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .status-value {
    font-size: 14px;
    font-weight: 600;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .power-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .3s cubic-bezier(.4,0,.2,1);
    flex: none;
    position: relative;
  }
  .power-btn:hover {
    border-color: var(--accent);
    transform: scale(1.05);
  }
  .power-btn.on {
    background: linear-gradient(135deg, var(--success), #059669);
    border-color: var(--success);
    color: white;
    box-shadow: 0 0 0 4px rgba(16,185,129,.15), 0 4px 12px rgba(16,185,129,.3);
    animation: pulse-glow 2s ease-in-out infinite;
  }
  .power-btn.on:hover {
    transform: scale(1.08);
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 4px rgba(16,185,129,.15), 0 4px 12px rgba(16,185,129,.3); }
    50%      { box-shadow: 0 0 0 6px rgba(16,185,129,.25), 0 6px 20px rgba(16,185,129,.4); }
  }
  .power-icon {
    width: 20px;
    height: 20px;
    transition: transform .3s;
  }
  .power-btn.on .power-icon {
    transform: rotate(180deg);
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 2px 6px;
  }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .text-btn {
    font-size: 11px;
    color: var(--accent);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    font-weight: 500;
  }
  .text-btn:hover { background: var(--border-soft); }

  .list {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    transition: background .12s;
    border-bottom: 1px solid var(--border-soft);
    position: relative;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: var(--border-soft); }
  .item.active {
    background: linear-gradient(90deg, rgba(99,102,241,.08), rgba(139,92,246,.08));
  }
  .item.active .item-name { color: var(--accent); }
  .item.disabled { opacity: 0.55; cursor: not-allowed; }
  .item.disabled:hover { background: transparent; }

  .item-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    flex: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--border-soft);
    color: var(--text-muted);
  }
  .item.active .item-icon {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
  }
  .item-main { flex: 1; min-width: 0; }
  .item-name {
    font-weight: 500;
    font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-ping {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    flex: none;
    display: flex; align-items: center; gap: 4px;
  }
  .ping-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
  }
  .ping-good  { color: var(--success); }
  .ping-good  .ping-dot { background: var(--success); }
  .ping-ok    { color: var(--warning); }
  .ping-ok    .ping-dot { background: var(--warning); }
  .ping-bad   { color: var(--danger); }
  .ping-bad   .ping-dot { background: var(--danger); }

  .badge {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-left: 6px;
    vertical-align: middle;
  }
  .badge-maint { background: var(--warning-soft); color: var(--warning); }
  .badge-off   { background: var(--danger-soft);  color: var(--danger); }
  .badge-coming { background: rgba(34,211,238,.15); color: #22d3ee; border-radius: 10px; }

  .node-tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 1000;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
  .node-tooltip::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--card);
  }
  .item:hover .node-tooltip {
    opacity: 0.9;
    pointer-events: auto;
  }

  .footer {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
  }
  .footer-info {
    font-size: 10.5px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .toast {
    position: fixed;
    bottom: 14px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--text);
    color: white;
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transition: all .25s cubic-bezier(.4,0,.2,1);
    pointer-events: none;
    white-space: nowrap;
    max-width: 320px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .skeleton {
    background: linear-gradient(90deg, var(--border-soft) 0%, var(--border) 50%, var(--border-soft) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.2s ease-in-out infinite;
    border-radius: 4px;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Login Overlay */
  #loginOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  #loginOverlay.show {
    display: flex;
  }

  .login-modal {
    background: var(--card);
    border-radius: 16px;
    padding: 32px 28px;
    width: 300px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  }

  .login-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
  }

  .login-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .login-form-group {
    margin-bottom: 20px;
  }

  .login-form-group label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .login-form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    font-family: monospace;
    transition: all .2s;
    outline: none;
  }

  .login-form-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
  }

  .login-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }

  .login-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
  }

  .login-btn:active {
    transform: translateY(0);
  }

  .login-error {
    color: var(--danger);
    font-size: 11px;
    margin-top: 12px;
    display: none;
  }

  .login-error.show {
    display: block;
  }
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-modal">
    <div class="login-title">proxy hub</div>
    <div class="login-subtitle">Enter your access token</div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="login-form-group">
        <label for="accessTokenInput">ACCESS TOKEN</label>
        <input 
          type="text" 
          id="accessTokenInput" 
          placeholder="cloudfoxtrot435"
          autocomplete="off"
          spellcheck="false"
        >
      </div>
      <button type="submit" class="login-btn">Login</button>
      <div id="loginError" class="login-error"></div>
    </form>
  </div>
</div>

<div class="header">
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l3 7h7l-5.5 4.5L18 22l-6-4-6 4 1.5-8.5L2 9h7z"/>
    </svg>
  </div>
  <div class="header-text">
    <h1>proxy hub</h1>
    <div class="header-sub" id="hubHost">vpn.oofbomb.xyz</div>
    <div class="hub-status" id="hubStatus">
      <span class="hub-status-dot"></span>
      <span class="hub-status-text">checking...</span>
    </div>
  </div>
  <button class="icon-btn" id="refreshBtn" title="Refresh nodes">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
  </button>
  <button class="icon-btn" id="notifBtn" title="Notifications" style="position:relative;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span id="notifBadge" style="display:none;position:absolute;top:-2px;right:-2px;background:var(--danger);color:white;font-size:9px;font-weight:700;padding:1px 4px;border-radius:8px;line-height:1;">0</span>
  </button>
  <button class="icon-btn" id="optionsBtn" title="Settings">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</div>

<div class="status">
  <div class="status-row">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-main">
      <div class="status-label">Current</div>
      <div class="status-value" id="statusValue">Direct</div>
      <div class="status-meta" id="statusMeta"></div>
    </div>
    <button class="power-btn" id="powerBtn" title="Toggle proxy">
      <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v10M18.36 6.64a9 9 0 1 1-12.73 0"/>
      </svg>
    </button>
  </div>
</div>

<div class="section-header">
  <div class="section-title">Profiles</div>
</div>
<div class="list" id="profileList"></div>

<div class="section-header">
  <div class="section-title">Nodes</div>
  <div class="footer-info" id="nodeCount"></div>
</div>
<div class="list" id="nodeList">
  <div class="item disabled"><div class="item-icon skeleton" style="width:28px;height:28px;"></div>
    <div class="item-main"><div class="skeleton" style="width:120px;height:12px;"></div>
      <div class="skeleton" style="width:80px;height:10px;margin-top:6px;"></div></div></div>
</div>

<div class="footer">
  <div class="footer-info" id="lastUpdate">Loading…</div>
  <button class="text-btn" id="openHubBtn">Open hub ↗</button>
</div>

<div id="notifPanel" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:9999;">
  <div style="background:var(--card);margin:40px auto;max-width:380px;border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:calc(100vh - 80px);overflow:hidden;display:flex;flex-direction:column;">
    <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
      <div style="font-weight:600;font-size:14px;">Notifications</div>
      <div style="display:flex;gap:6px;">
        <button class="text-btn" id="clearNotifsBtn">Clear</button>
        <button class="icon-btn" id="closeNotifBtn" style="width:24px;height:24px;">✕</button>
      </div>
    </div>
    <div id="notifList" style="overflow-y:auto;flex:1;padding:8px;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
