# ─── 3proxy Node Config (Linux) ──────────────────────────────────────────────
# Installed to: /etc/3proxy/conf/3proxy.cfg
# Logs go to:   /usr/local/3proxy/logs/ (chroot path = /logs/)
# Service:      systemctl start|stop|restart|status 3proxy
#
# This node ONLY accepts connections from your hub's Tailscale IP.

nserver 1.1.1.1
nserver 8.8.8.8
nscache 65536
timeouts 1 5 30 60 180 1800 15 60

daemon

# Stats logging — path is relative to chroot /usr/local/3proxy/
# So /logs/ = /usr/local/3proxy/logs/ on disk
# Run: sudo mkdir -p /usr/local/3proxy/logs && sudo chmod 777 /usr/local/3proxy/logs
log /logs/3proxy.log D
logformat "STAT %t %C %I %O %D %b %B %R %U %h"
logdump 1048576 1048576

# Only accept connections from the hub's Tailscale IP
auth iponly
allow * HUB_TAILSCALE_IP
deny *

# SOCKS5 — only bind to Tailscale interface
socks -p1080 -iNODE_TAILSCALE_IP -osTCP_NODELAY -ocTCP_NODELAY -n

# HTTP proxy for ping/health checks
proxy -p3128 -iNODE_TAILSCALE_IP -osTCP_NODELAY -ocTCP_NODELAY -n