# ─── 3proxy Hub Config (Windows) ─────────────────────────────────────────────
# Lives next to 3proxy.exe in your bin64 folder
# Controls: load balancing across nodes via parent chaining
# Edit node IPs and weights via the dashboard — it rewrites this file

nserver 1.1.1.1
nserver 8.8.8.8
nscache 65536

# Timeouts: short/long connection, DNS, chain
timeouts 1 5 30 60 180 1800 15 60

# Log to file with full per-connection stats
# %C=client IP, %I=bytes_in, %O=bytes_out, %D=duration_ms, %b=send_rate, %B=recv_rate, %R=remote, %U=user
log 3proxy.log D
logformat "STAT %t %C %I %O %D %b %B %R %U %h"
logdump 1048576 1048576

# Auth by IP only — lets ACLs work while keeping it passwordless for clients
auth iponly

# ── Whitelist (managed by dashboard) ──────────────────────────────────────────
include whitelist.cfg

# Deny everyone else
deny *


# Weights must total 1000. Dashboard rewrites these lines.
# Home node (Omaha) — default preferred
allow *
parent 800 socks5 100.80.92.110 1080

# NYC node — spillover
allow *
parent 100 socks5 100.83.25.74 1080

#chicago node — spillover
allow *
parent 100 socks5 100.87.224.117 1080

# Hotloop disabled — no chaining, hub is exit


# Hotloop disabled — no chaining, hub is exit

# ── Load Balancer ────────────────────────────────────────────────────────────
# Hotloop disabled — no chaining, hub is exit

# ── SOCKS5 listener — clients connect here ────────────────────────────────────
# TCP_NODELAY on both sides kills the Nagle buffering delay
socks -p1080 -osTCP_NODELAY -ocTCP_NODELAY -n

# ── HTTP proxy too (optional, port 3128) ──────────────────────────────────────
proxy -p3128 -osTCP_NODELAY -ocTCP_NODELAY -n